name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release version and image name
        id: project
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = f"v{version}"
              if os.environ["GITHUB_REF_NAME"] != expected:
                  raise SystemExit(f"Release tag must be {expected}, matching pyproject.toml")
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nimage={image}\n")
          PY

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.project.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke checks
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: lin26-ais:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lin26-ais-amd64
          cache-to: type=gha,mode=max,scope=lin26-ais-amd64

      - name: Check CLI, dependencies, and runtime user
        env:
          EXPECTED_VERSION: ${{ steps.project.outputs.version }}
        run: |
          docker run --rm --network none lin26-ais:ci --help
          docker run --rm --network none --env EXPECTED_VERSION \
            --entrypoint python lin26-ais:ci -c \
            'import os; from importlib.metadata import version; import sklearn; assert version("lin26-ais") == os.environ["EXPECTED_VERSION"]; assert sklearn.__version__ == "1.5.2"; assert os.getuid() == 9876; print("Package version, model dependency, and non-root user verified")'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lin26-ais-amd64

      - name: Record published image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_NAME: ${{ steps.project.outputs.image }}
          IMAGE_VERSION: ${{ steps.project.outputs.version }}
        run: |
          {
            echo "### Published container"
            echo
            echo "Image: ${IMAGE_NAME}:${IMAGE_VERSION}"
            echo
            echo "Pull with: docker pull ${IMAGE_NAME}:${IMAGE_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
