[project]
name = "lin26-ais"
version = "0.1.3"
description = "Containerized application that generates estimates of Antarctic ice sheet contributions to future sea level change following the modeling approach developed by Lin et al. (2026)."
readme = "README.md"
authors = [
    { name = "Yucheng Lin", email = "yucheng.lin@cityu.edu.hk" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "netcdf4>=1.7.5",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
]

[project.scripts]
module-template = "lin26_ais.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"
